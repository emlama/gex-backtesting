[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spx-options-backtesting"
version = "0.1.0"
description = "SPX minute indicators and opening-range option-expiry backtests"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
osbt = [
    "osbt @ git+https://github.com/dremg/osbt-public.git@063d8b046abddb65757fe037f5bc0cee7d00f249",
]
jupyter = [
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.setuptools]
packages = []

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
